<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7-Day Meal Tracker (v1.2 - Notes & Comments)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --accent: #f1f5f9;
      --border: #e2e8f0;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .version-badge {
      font-size: 0.75rem;
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 8px;
      border-radius: 12px;
      vertical-align: middle;
      margin-left: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group-full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--accent);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    .btn-danger-sm {
      background-color: transparent;
      color: var(--danger);
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .btn-danger-sm:hover {
      background-color: #fef2f2;
      border-radius: 4px;
    }

    .btn-edit-sm {
      background-color: transparent;
      color: var(--primary);
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .btn-edit-sm:hover {
      background-color: #eff6ff;
      border-radius: 4px;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group label {
      text-transform: none;
      letter-spacing: normal;
      font-size: 0.9rem;
    }

    .filter-group select {
      width: auto;
      padding: 6px 10px;
    }

    .table-container {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
      background: var(--card-bg);
    }

    th {
      background-color: var(--accent);
      color: var(--text-main);
      font-weight: 600;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th:hover {
      background-color: #e2e8f0;
    }

    th .sort-icon {
      margin-left: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .notes-cell {
      color: var(--text-muted);
      font-size: 0.875rem;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .cat-breakfast { background: #fef3c7; color: #92400e; }
    .cat-lunch     { background: #dbeafe; color: #1e40af; }
    .cat-dinner    { background: #e0e7ff; color: #3730a3; }
    .cat-dessert   { background: #fce7f3; color: #9d174d; }
    .cat-snacks    { background: #dcfce7; color: #166534; }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>7-Day Meal Tracker <span class="version-badge">v1.2</span></h1>
      <p>Log, edit, and organize your weekly meals with Firebase Firestore</p>
    </header>

    <div class="card">
      <div class="card-title" id="formTitle">Log New Meal</div>
      <form id="mealForm">
        <input type="hidden" id="editId" value="" />
        
        <div class="form-grid">
          <div class="form-group">
            <label for="dateTime">Date & Time</label>
            <input type="datetime-local" id="dateTime" required />
          </div>

          <div class="form-group">
            <label for="category">Meal Category</label>
            <select id="category" required>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
              <option value="Dessert">Dessert</option>
              <option value="Snacks">Snacks</option>
            </select>
          </div>

          <div class="form-group">
            <label for="itemName">Food / Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Toast, White Bread, Milk" required />
          </div>

          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" step="any" min="0" placeholder="e.g. 2, 1.5" />
          </div>

          <div class="form-group">
            <label for="unit">Unit</label>
            <select id="unit">
              <option value="">-- None --</option>
              <option value="cups">cups</option>
              <option value="grams">grams (g)</option>
              <option value="ounces">ounces (oz)</option>
              <option value="slices">slices</option>
              <option value="pieces">pieces</option>
              <option value="ml">milliliters (ml)</option>
              <option value="tbsp">tablespoons (tbsp)</option>
              <option value="tsp">teaspoons (tsp)</option>
            </select>
          </div>

          <div class="form-group form-group-full">
            <label for="notes">Notes / Comments</label>
            <input type="text" id="notes" placeholder="e.g. Organic, whole wheat, added sugar, brand name..." />
          </div>
        </div>

        <div class="btn-group">
          <button type="button" id="cancelBtn" class="btn-secondary" style="display: none;">Cancel</button>
          <button type="submit" id="submitBtn" class="btn-primary">Add Meal Entry</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="controls-bar">
        <div class="card-title" style="margin-bottom: 0;">Meal History</div>
        
        <div class="filter-group">
          <label for="filterCategory">Filter by Category:</label>
          <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Dessert">Dessert</option>
            <option value="Snacks">Snacks</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th onclick="sortTable('dateTime')">Date & Time <span class="sort-icon" id="sort-dateTime">▼</span></th>
              <th onclick="sortTable('category')">Category <span class="sort-icon" id="sort-category"></span></th>
              <th onclick="sortTable('itemName')">Item Name <span class="sort-icon" id="sort-itemName"></span></th>
              <th onclick="sortTable('quantity')">Quantity <span class="sort-icon" id="sort-quantity"></span></th>
              <th style="cursor: default;">Unit</th>
              <th style="cursor: default;">Notes / Comments</th>
              <th style="cursor: default; text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="mealTableBody">
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // -------------------------------------------------------------
    // 1. FIREBASE CONFIGURATION (Replace with your actual keys)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyDB-4V2EeH6PpnA5A0eF1gWg4byqWZJaS4",
      authDomain: "day-meal-tracker.firebaseapp.com",
      projectId: "day-meal-tracker",
      storageBucket: "day-meal-tracker.firebasestorage.app",
      messagingSenderId: "887302499002",
      appId: "1:887302499002:web:cdd14253e71a739f4fb083",
      measurementId: "G-WG281FT3VQ"
    };

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const mealsCollection = collection(db, "meals");

    // Local State
    let meals = [];
    let sortColumn = 'dateTime';
    let sortAscending = false;

    // Helper: Set default DateTime input to current time
    function setCurrentDateTimeInput() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('dateTime').value = now.toISOString().slice(0, 16);
    }

    // -------------------------------------------------------------
    // 2. REAL-TIME FIRESTORE LISTENER
    // -------------------------------------------------------------
    onSnapshot(mealsCollection, (snapshot) => {
      meals = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      renderTable();
    }, (error) => {
      console.error("Firestore error:", error);
    });

    // -------------------------------------------------------------
    // 3. TABLE RENDERING & SORTING
    // -------------------------------------------------------------
    function renderTable() {
      const tbody = document.getElementById('mealTableBody');
      const filterCategory = document.getElementById('filterCategory').value;

      let filteredMeals = meals.filter(m => filterCategory === 'All' || m.category === filterCategory);

      filteredMeals.sort((a, b) => {
        let valA = a[sortColumn];
        let valB = b[sortColumn];

        if (sortColumn === 'quantity') {
          valA = parseFloat(valA) || 0;
          valB = parseFloat(valB) || 0;
        } else if (typeof valA === 'string') {
          valA = valA.toLowerCase();
          valB = valB.toLowerCase();
        }

        if (valA < valB) return sortAscending ? -1 : 1;
        if (valA > valB) return sortAscending ? 1 : -1;
        return 0;
      });

      ['dateTime', 'category', 'itemName', 'quantity'].forEach(col => {
        const icon = document.getElementById(`sort-${col}`);
        if (icon) {
          icon.textContent = col === sortColumn ? (sortAscending ? '▲' : '▼') : '';
        }
      });

      if (filteredMeals.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No meal records found. Log a meal using the form above!</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredMeals.map(m => {
        const formattedDate = new Date(m.dateTime).toLocaleString([], {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const badgeClass = `cat-${m.category.toLowerCase()}`;

        return `
          <tr>
            <td>${formattedDate}</td>
            <td><span class="category-badge ${badgeClass}">${m.category}</span></td>
            <td><strong>${escapeHtml(m.itemName)}</strong></td>
            <td>${m.quantity !== '' && m.quantity !== null && m.quantity !== undefined ? m.quantity : '-'}</td>
            <td>${m.unit ? escapeHtml(m.unit) : '-'}</td>
            <td class="notes-cell" title="${escapeHtml(m.notes || '')}">${m.notes ? escapeHtml(m.notes) : '-'}</td>
            <td style="text-align: right;">
              <button class="btn-edit-sm" onclick="window.editMeal('${m.id}')">Edit</button>
              <button class="btn-danger-sm" onclick="window.deleteMeal('${m.id}')">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.sortTable = function(column) {
      if (sortColumn === column) {
        sortAscending = !sortAscending;
      } else {
        sortColumn = column;
        sortAscending = true;
      }
      renderTable();
    };

    // -------------------------------------------------------------
    // 4. CRUD OPERATIONS WITH FIRESTORE
    // -------------------------------------------------------------
    document.getElementById('mealForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const editId = document.getElementById('editId').value;
      const dateTime = document.getElementById('dateTime').value;
      const category = document.getElementById('category').value;
      const itemName = document.getElementById('itemName').value.trim();
      const quantity = document.getElementById('quantity').value;
      const unit = document.getElementById('unit').value;
      const notes = document.getElementById('notes').value.trim();

      try {
        if (editId) {
          const docRef = doc(db, "meals", editId);
          await updateDoc(docRef, { dateTime, category, itemName, quantity, unit, notes });
        } else {
          await addDoc(mealsCollection, { dateTime, category, itemName, quantity, unit, notes });
        }
        resetForm();
      } catch (err) {
        alert("Error saving document: " + err.message);
      }
    });

    window.editMeal = function(id) {
      const meal = meals.find(m => m.id === id);
      if (!meal) return;

      document.getElementById('editId').value = meal.id;
      document.getElementById('dateTime').value = meal.dateTime;
      document.getElementById('category').value = meal.category;
      document.getElementById('itemName').value = meal.itemName;
      document.getElementById('quantity').value = meal.quantity || '';
      document.getElementById('unit').value = meal.unit || '';
      document.getElementById('notes').value = meal.notes || '';

      document.getElementById('formTitle').textContent = 'Edit Meal Record';
      document.getElementById('submitBtn').textContent = 'Save Changes';
      document.getElementById('cancelBtn').style.display = 'inline-block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteMeal = async function(id) {
      if (confirm('Are you sure you want to delete this meal entry?')) {
        try {
          await deleteDoc(doc(db, "meals", id));
        } catch (err) {
          alert("Error deleting record: " + err.message);
        }
      }
    };

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('mealForm').reset();
      document.getElementById('formTitle').textContent = 'Log New Meal';
      document.getElementById('submitBtn').textContent = 'Add Meal Entry';
      document.getElementById('cancelBtn').style.display = 'none';
      setCurrentDateTimeInput();
    }

    document.getElementById('cancelBtn').addEventListener('click', resetForm);
    document.getElementById('filterCategory').addEventListener('change', renderTable);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    setCurrentDateTimeInput();
  </script>
</body>
</html>
